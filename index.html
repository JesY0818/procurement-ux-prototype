<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>集团型国企定额物资采购活动管理平台｜低保真原型</title>
<style>
:root{--bg:#f4f4f4;--panel:#fff;--ink:#202020;--muted:#666;--line:#c9c9c9;--dark:#303030;--soft:#ececec;--warn:#fff6d8;--bad:#fff0f0;--good:#edf7ed}*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:58px;background:var(--dark);color:#fff;display:flex;align-items:center;gap:16px;padding:0 20px;position:sticky;top:0;z-index:10}.brand{font-weight:700}.grow{flex:1}.badge{display:inline-block;border:1px solid #888;border-radius:3px;padding:2px 7px;font-size:12px;background:#fafafa;color:#333}.top .badge{background:#555;color:#fff}.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 58px)}aside{background:#e7e7e7;border-right:1px solid var(--line);padding:14px 10px}.nav{width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;margin:2px 0;border-radius:4px;color:#333}.nav:hover,.nav.active{background:#333;color:#fff}.nav small{display:block;opacity:.75}.content{padding:22px;max-width:1440px;width:100%;margin:auto}.crumb{color:var(--muted);font-size:12px;margin-bottom:10px}.pagehead{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}.pagehead h1{font-size:24px;margin:0 0 4px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:16px;margin-bottom:14px}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.metric{font-size:26px;font-weight:700}.muted{color:var(--muted)}.hint{padding:10px 12px;background:var(--warn);border-left:4px solid #777;margin:10px 0}.error{padding:10px 12px;background:var(--bad);border:1px solid #b77777;margin:10px 0}.success{padding:10px 12px;background:var(--good);border:1px solid #7a9a7a;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #555;background:#fff;color:#222;border-radius:4px;padding:8px 13px}.btn.primary{background:#333;color:#fff}.btn.danger{border-color:#8b4b4b;color:#7a2222}.btn:disabled{opacity:.45;cursor:not-allowed}.field{margin-bottom:12px}.field label{display:block;font-weight:600;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #999;border-radius:3px;padding:8px;background:#fff}.field .help{font-size:12px;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #ddd;text-align:left;padding:9px 8px;vertical-align:top}th{background:#efefef;font-size:12px}.status{display:inline-block;padding:2px 7px;border-radius:12px;background:#e4e4e4;font-size:12px}.status.ok{background:#dcebdc}.status.wait{background:#fff0be}.status.bad{background:#f2d7d7}.stepbar{display:flex;gap:6px;margin-bottom:14px}.step{flex:1;padding:7px;text-align:center;border:1px solid #bbb;background:#eee}.step.on{background:#333;color:#fff}.tabs{display:flex;border-bottom:1px solid #aaa;margin-bottom:14px}.tab{border:0;background:transparent;padding:9px 15px}.tab.on{border-bottom:3px solid #222;font-weight:700}.mobile-wrap{max-width:410px;margin:0 auto;background:#d8d8d8;padding:12px;border-radius:24px}.mobile{min-height:680px;background:#fff;border:1px solid #999;border-radius:16px;overflow:hidden}.mobile-head{background:#333;color:#fff;padding:14px}.mobile-body{padding:16px}.choice{display:block;border:1px solid #aaa;padding:10px;margin:8px 0;border-radius:4px}.choice:has(input:checked){border:2px solid #333;background:#eee}.footer-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:12px;border-top:1px solid #ddd}.overlay{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:30}.dialog{background:#fff;border:2px solid #333;padding:22px;max-width:520px;width:calc(100% - 32px)}.toast{position:fixed;right:22px;bottom:22px;background:#222;color:#fff;padding:11px 16px;z-index:40;border-radius:4px}.hidden{display:none!important}.synth{font-size:12px;background:#efefef;border:1px dashed #777;padding:6px 9px;margin-bottom:12px}.checkrow{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #eee}.timeline{border-left:2px solid #999;margin-left:8px;padding-left:18px}.timeline p{position:relative}.timeline p:before{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#555;left:-24px;top:6px}.state-toolbar{display:flex;gap:8px;align-items:center}.state-toolbar select{max-width:190px}.pending{border:1px dashed #8b6f1f;background:#fff9df;padding:9px;margin:8px 0}.roleline{font-size:12px;color:#ddd}@media(max-width:900px){.shell{grid-template-columns:1fr}aside{display:none}.content{padding:14px}.g2,.g3,.g4{grid-template-columns:1fr}.top{height:auto;min-height:58px;flex-wrap:wrap;padding:10px 14px}.state-toolbar{width:100%}.state-toolbar select{flex:1}.pagehead{display:block}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><div class="brand">定额物资采购活动平台</div><div class="roleline" id="roleLine">采购人员 · 华东分公司（合成示例）</div></div>
    <span class="badge">低保真</span><span class="badge">全部为合成示例数据</span><div class="grow"></div>
    <div class="state-toolbar"><label for="roleSelect">角色演示</label><select id="roleSelect"><option>采购人员</option><option>部门负责人</option><option>授权上级</option><option>职工</option><option>财务／审计</option></select><label for="globalState">全局状态</label><select id="globalState"><option value="normal">正常</option><option value="login">SSO 登录／返回</option><option value="expired">会话失效</option><option value="denied">无权限</option><option value="identity">身份识别失败</option><option value="org">组织识别失败</option><option value="service">权限服务不可用</option></select></div>
  </header>
  <div class="shell"><aside id="sidebar"></aside><main class="content"><div id="view"></div></main></div>
</div>
<div id="overlay" class="hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const pages=[
['workbench','采购工作台','活动总览'],['activity','活动与规则','基本信息／规则'],['people','人员核对','名单／冲突'],['packages','套餐配置','商品／金额'],['publish','参与任务与发布检查','配置／校验'],['employee','职工统一参与','移动端'],['progress','参与进度与异常','提醒／默认'],['handoff','统计、BOM 与正式交接','统计／交接／回执'],['receipt','职工收货与签收','移动端'],['archive','履约、补证与归档','履约／证据']];
const S={page:'workbench',activity:'准备中',peopleResolved:false,packageValid:true,published:false,employeeStep:1,employeeSubmitted:false,scene:'',pkg:'',address:'某市某区示例路 100 号（合成示例）',defaultsDone:false,defaultAddressValid:true,defaultIssue:false,handoffTab:'stats',statsFrozen:false,candidateGenerated:false,sendFailed:false,received:false,signed:false,receiptType:'',proxyNote:'',evidence:false,role:'采购人员'};
const q=(n,t)=>`<div class="pending"><b>${n} 待确认方案</b>：${t}</div>`;
const synth=`<div class="synth">演示声明：页面中的组织、人员、商品、金额明细和操作记录均为合成示例，不代表真实业务记录或测试结果。</div>`;
const rolePages={'采购人员':['workbench','activity','people','packages','publish','progress','handoff','archive'],'部门负责人':['people','progress'],'授权上级':['workbench','publish','handoff'],'职工':['employee','receipt'],'财务／审计':['archive']};
function allowed(p){return rolePages[S.role].includes(p)}
function nav(){sidebar.innerHTML=pages.filter(p=>allowed(p[0])).map((p,i)=>`<button class="nav ${S.page===p[0]?'active':''}" onclick="go('${p[0]}')"><small>${String(i+1).padStart(2,'0')}</small>${p[1]}</button>`).join('')}
function go(p){if(!allowed(p)){modal('无权限','当前角色不能访问该页面。直接访问不会展示业务对象摘要。');return}S.page=p;render();scrollTo(0,0)}
function switchRole(role,p){S.role=role;S.page=p;render();scrollTo(0,0)}
function roleHome(role){return {'采购人员':'workbench','部门负责人':'people','授权上级':'workbench','职工':'employee','财务／审计':'archive'}[role]}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2300)}
function modal(title,body,ok='知道了',action='closeModal()'){overlay.className='overlay';overlay.innerHTML=`<div class="dialog"><h2>${title}</h2><div>${body}</div><div class="actions"><button class="btn primary" onclick="${action}">${ok}</button><button class="btn" onclick="closeModal()">关闭</button></div></div>`}
function closeModal(){overlay.className='hidden';overlay.innerHTML=''}
function head(title,sub,role='采购人员（PC 管理端）'){return `<div class="crumb">合成示例活动 / ${title}</div><div class="pagehead"><div><h1>${title}</h1><div class="muted">${sub}</div></div><div class="grow"></div><span class="badge">${role}</span></div>${synth}`}
function next(p,label='下一步'){return `<div class="footer-nav"><span class="muted">关键操作均可点击演示</span><button class="btn primary" onclick="go('${p}')">${label}</button></div>`}
function workbench(){return head('采购工作台','查看活动进度、风险与待办')+`<div class="grid g4"><div class="panel"><div class="muted">进行中活动</div><div class="metric">1</div></div><div class="panel"><div class="muted">待处理异常</div><div class="metric">2</div></div><div class="panel"><div class="muted">参与完成率</div><div class="metric">75%</div></div><div class="panel"><div class="muted">待补证</div><div class="metric">1</div></div></div><div class="panel"><h2>2026 防暑降温物资活动（合成示例）</h2><p><span class="status wait">${S.activity}</span>　参与期：2026-06-01 至 2026-06-07</p><div class="grid g3"><div><b>规则版本</b><br>2026-R1（示例）</div><div><b>人员</b><br>4 人，其中 1 项待核对</div><div><b>套餐</b><br>类别乙 2 套（映射待核实）</div></div><div class="actions"><button class="btn primary" onclick="go('activity')">继续准备活动</button><button class="btn" onclick="modal('权限说明','工作台按组织与角色显示活动。跨组织查看由正式权限矩阵决定。')">查看权限边界</button></div></div>${q('Q02','正式审批链与敏感操作权限矩阵尚未确定；原型只演示入口和权限拦截。')} ${next('activity')}`}
function activity(){return head('活动与规则','维护活动基本信息与当年规则快照')+`<div class="grid g2"><section class="panel"><h2>活动基本信息／概览</h2><div class="field"><label>活动名称</label><input value="2026 防暑降温物资活动（合成示例）"></div><div class="field"><label>组织</label><input value="华东分公司（合成示例）" disabled></div><div class="field"><label>参与时间</label><input value="2026-06-01 09:00 — 2026-06-07 18:00"></div><button class="btn" onclick="toast('活动草稿已保存（仅本地演示）')">保存草稿</button></section><section class="panel"><h2>规则快照</h2><p>规则版本：2026-R1（合成示例）</p><table><tr><th>定额级别</th><th>金额上限</th><th>类别映射</th></tr><tr><td>级别 1</td><td>235.00 元</td><td>待正式文件核实</td></tr><tr><td>级别 2</td><td>278.00 元</td><td>待正式文件核实</td></tr><tr><td>级别 3</td><td>318.00 元</td><td>待正式文件核实</td></tr></table><div class="hint">套餐金额可低于定额，但不得超过；上浮 0.01 元也阻断。甲乙丙映射不按金额顺序猜测。</div><button class="btn" onclick="toast('已记录规则快照确认（演示）')">确认已核对来源</button></section></div>${next('people')}`}
function people(){return head('人员核对','部门负责人核对后，由采购处理冲突并形成活动人员快照')+`<div class="panel"><div class="actions"><button class="btn" onclick="toast('已模拟同步人事名单')">同步名单</button><button class="btn" onclick="toast('已导出合成示例核对表')">导出核对表</button>${S.role==='部门负责人'?`<button class="btn primary" data-role-action onclick="toast('本部门核对结果已提交（演示）')">提交本部门核对结果</button>`:''}</div><table><tr><th>人员</th><th>部门</th><th>身份状态</th><th>配发类别</th><th>核对状态</th><th>操作</th></tr><tr><td>职工 A01</td><td>生产一部</td><td>在职</td><td>类别乙</td><td><span class="status ok">已核对</span></td><td>查看</td></tr><tr><td>职工 A02</td><td>生产一部</td><td>外派</td><td>类别乙</td><td><span class="status ok">已核对</span></td><td>查看</td></tr><tr><td>职工 B01</td><td>综合部</td><td>在职</td><td>${S.peopleResolved?'类别甲':'缺失'}</td><td><span class="status ${S.peopleResolved?'ok':'bad'}">${S.peopleResolved?'已解决':'冲突待处理'}</span></td><td><button class="btn" onclick="resolvePerson()">${S.peopleResolved?'查看记录':'处理'}</button></td></tr><tr><td>职工 C01</td><td>生产二部</td><td>活动后离职</td><td>类别丙</td><td><span class="status wait">人工协调</span></td><td><button class="btn" onclick="modal('人工协调','活动开始后办理离职者仍发放；少见例外由人工处理并留痕。原型不新增履约子状态。')">记录说明</button></td></tr></table></div><div class="hint">人员身份／状态与配发类别是两个独立字段，不得合并。</div>${S.role==='采购人员'?next('packages'):''}`}
function resolvePerson(){modal('处理人员冲突',`<div class="field"><label>配发类别</label><select id="cat"><option>类别甲</option><option>类别乙</option><option>类别丙</option></select></div><div class="field"><label>处理依据</label><textarea id="reason">部门负责人核对反馈（合成示例）</textarea></div><div class="hint">此操作必须留痕；正式可操作角色受 Q02 控制。</div>`,'保存处理记录',"S.peopleResolved=true;closeModal();render();toast('冲突已解决并留痕（演示）')")}
function packages(){return head('套餐配置','按配发类别维护最多 10 套套餐，执行确定性金额校验')+`<div class="grid g2"><div class="panel"><h2>类别乙 · 套餐 A</h2><p>定额上限：278.00 元　<span class="status ${S.packageValid?'ok':'bad'}">${S.packageValid?'校验通过':'超额阻断'}</span></p><table><tr><th>商品</th><th>唯一标识</th><th>单价</th><th>数量</th></tr><tr><td>防护用品 P1（合成）</td><td>SKU-DEMO-001</td><td>128.00</td><td>1</td></tr><tr><td>防护用品 P2（合成）</td><td>SKU-DEMO-002</td><td>${S.packageValid?'148.80':'150.01'}</td><td>1</td></tr></table><p><b>合计：${S.packageValid?'276.80':'278.01'} 元</b></p>${S.packageValid?'':`<div class="error">超过定额 0.01 元，无法确认套餐。</div>`}<div class="actions"><button class="btn" onclick="S.packageValid=!S.packageValid;render()">${S.packageValid?'演示超额':'恢复合规金额'}</button><button class="btn primary" ${S.packageValid?'':'disabled'} onclick="toast('套餐已确认（演示）')">确认套餐</button></div></div><div class="panel"><h2>类别套餐</h2><p>有效套餐 2 / 10</p><div class="checkrow"><b>套餐 A</b><span class="grow"></span><span class="status ok">276.80 元</span></div><div class="checkrow"><b>套餐 B</b><span class="grow"></span><span class="status ok">272.00 元</span></div><button class="btn" onclick="toast('已新增套餐草稿（演示，未超过类别上限）')">新增套餐草稿</button>${q('Q11','商品唯一编码、有效价格、含税／运费、库存和上下架口径待责任方确认。当前字段为 UX 设计方案。')} ${q('Q18','AI 套餐共创默认关闭；仅获批后可在脱敏商品池内生成候选草稿，不能自动发布。')}</div></div>${next('publish')}`}
function publish(){const blocked=!S.peopleResolved||!S.packageValid;return head('参与任务与发布检查','配置统一参与任务，发布前集中检查规则、人员、套餐和权限')+`<div class="grid g2"><section class="panel"><h2>参与任务配置</h2><div class="field"><label>参与窗口</label><input value="2026-06-01 09:00 — 2026-06-07 18:00"></div><div class="field"><label>类别乙默认套餐</label><select><option>套餐 A（276.80 元）</option></select></div><div class="field"><label>默认地址策略</label><select><option>采用活动前最近一次有效地址；无地址进入异常队列</option></select></div><div class="field"><label>提醒时间</label><input value="截止前 48 小时、24 小时"></div></section><section class="panel"><h2>发布检查</h2>${[['规则快照','已核对'],['人员冲突',S.peopleResolved?'已清除':'1 项阻断'],['套餐金额',S.packageValid?'全部通过':'1 项超额'],['参与窗口','已配置'],['发布权限','设计方案演示']].map(x=>`<div class="checkrow"><span>${x[0]}</span><span class="grow"></span><span class="status ${x[1].includes('阻断')||x[1].includes('超额')?'bad':'ok'}">${x[1]}</span></div>`).join('')}${blocked?`<div class="error">存在阻断项。请先处理人员冲突并恢复合规套餐金额。</div>`:''}${S.role==='采购人员'?`<button class="btn primary" ${blocked?'disabled':''} onclick="confirmPublish()">确认发布</button>`:`<button class="btn primary" data-role-action onclick="modal('受控操作演示','授权上级可按正式权限处理敏感操作；具体岗位、审批级数和动作仍由 Q02 决定，本原型不视为审批通过。')">查看受控操作</button>`}${q('Q02','原型以采购人员触发发布演示；正式发布权和审批链仍待确认。')}</section></div>${S.role==='采购人员'?next('employee','进入职工参与演示'):''}`}
function confirmPublish(){modal('确认发布活动',`<p>发布后将生成职工统一参与任务，并记录操作日志。</p><p>此按钮仅执行本地低保真演示。</p>`,'确认发布',"S.published=true;S.activity='参与中';closeModal();switchRole('职工','employee');toast('活动已发布（本地演示）')")}
function employee(){let body='';if(S.employeeStep===1)body=`<h2>1. 本次需求问卷</h2><div class="field"><label>主要使用场景</label><select id="scene"><option value="">请选择</option><option ${S.scene==='户外作业'?'selected':''}>户外作业</option><option ${S.scene==='室内作业'?'selected':''}>室内作业</option></select></div><div class="field"><label>本次地址是否变化</label><label class="choice"><input type="radio" name="change" checked> 无变化</label><label class="choice"><input type="radio" name="change"> 有变化</label></div><button class="btn primary" onclick="saveSurvey()">下一步</button>`;if(S.employeeStep===2)body=`<h2>2. 选择一个套餐</h2><p>本人配发类别：类别乙</p><label class="choice"><input type="radio" name="pkg" value="A" ${S.pkg==='A'?'checked':''}> 套餐 A · 276.80 元<br><span class="muted">防护用品 P1 + P2（合成）</span></label><label class="choice"><input type="radio" name="pkg" value="B" ${S.pkg==='B'?'checked':''}> 套餐 B · 272.00 元<br><span class="muted">防护用品 P3 + P4（合成）</span></label><div class="actions"><button class="btn" onclick="S.employeeStep=1;render()">上一步</button><button class="btn primary" onclick="savePackage()">下一步</button></div>`;if(S.employeeStep===3)body=`<h2>3. 确认本次活动地址</h2><div class="field"><label>收货地址</label><textarea id="addr">${S.address}</textarea><div class="help">本次提交形成活动地址快照，不直接覆盖个人主数据。</div></div><label class="choice"><input type="checkbox" id="agree"> 我已核对问卷、套餐和本次地址</label><div class="actions"><button class="btn" onclick="S.address=document.querySelector('#addr').value;S.employeeStep=2;render()">上一步</button><button class="btn primary" onclick="submitEmployee()">提交参与结果</button></div>`;if(S.employeeSubmitted)body=`<div class="success"><h2>提交成功</h2><p>已形成统一参与版本 DEMO-PART-01。</p></div><div class="timeline"><p>问卷：${S.scene}</p><p>已选择套餐 ${S.pkg}</p><p>活动地址快照已保存</p></div><button class="btn" onclick="S.employeeSubmitted=false;S.employeeStep=1;render()">重新演示</button>`;return head('职工统一参与','问卷、套餐选择与地址确认在同一窗口完成','职工（移动端）')+`<div class="mobile-wrap"><div class="mobile"><div class="mobile-head"><b>我的活动</b><br><small>2026 防暑降温物资活动（合成）</small></div><div class="mobile-body"><div class="stepbar"><div class="step ${S.employeeStep===1?'on':''}">问卷</div><div class="step ${S.employeeStep===2?'on':''}">套餐</div><div class="step ${S.employeeStep===3?'on':''}">地址</div></div>${body}</div></div></div><div class="footer-nav"><span class="muted">提交后切回采购角色</span><button class="btn primary" onclick="switchRole('采购人员','progress')">查看参与进度</button></div>`}
function saveSurvey(){const v=document.querySelector('#scene').value;if(!v){toast('请选择主要使用场景');return}S.scene=v;S.employeeStep=2;render()}
function savePackage(){const p=document.querySelector('input[name=pkg]:checked');if(!p){toast('请选择一个套餐');return}S.pkg=p.value;S.employeeStep=3;render()}
function submitEmployee(){const a=document.querySelector('#addr').value.trim(),c=document.querySelector('#agree').checked;if(!a){toast('请填写本次收货地址');return}if(!c){toast('请确认已核对提交内容');return}S.address=a;S.employeeSubmitted=true;render();toast('参与结果提交成功（演示）')}
function progress(){return head('参与进度与异常','跟踪完成情况、发送提醒、处理默认与异常')+`<div class="grid g3"><div class="panel"><div class="muted">应参与</div><div class="metric">4</div></div><div class="panel"><div class="muted">已提交</div><div class="metric">${S.employeeSubmitted?'3':'2'}</div></div><div class="panel"><div class="muted">异常／未完成</div><div class="metric">${S.defaultsDone&&!S.defaultIssue?'0':'1'}</div></div></div><div class="panel"><table><tr><th>人员</th><th>状态</th><th>地址</th><th>处理</th></tr><tr><td>职工 A01</td><td><span class="status ok">已提交</span></td><td>已形成快照</td><td>查看版本</td></tr><tr><td>职工 A02</td><td><span class="status ok">已提交</span></td><td>外派地址已核对</td><td>查看版本</td></tr><tr><td>职工 B01</td><td><span class="status ${S.defaultsDone?'wait':'bad'}">${S.defaultIssue?'地址异常':S.defaultsDone?'已默认':'未提交'}</span></td><td>${S.defaultIssue?'无有效默认地址':S.defaultsDone?'采用预设默认地址':'缺失'}</td><td><button class="btn" onclick="toast('已发送定向提醒（演示）')">提醒</button></td></tr></table>${S.defaultIssue?`<div class="error">默认地址无效：保留应发资格，进入异常队列，并阻断统计冻结与交接。</div>`:''}<div class="actions"><button class="btn" onclick="S.defaultAddressValid=!S.defaultAddressValid;render();toast(S.defaultAddressValid?'已恢复有效默认地址':'已设为无效默认地址（演示）')">${S.defaultAddressValid?'演示无效默认地址':'恢复有效默认地址'}</button><button class="btn primary" onclick="runDefaults()">执行截止默认处理</button><button class="btn" ${S.defaultIssue?'':'disabled'} onclick="S.defaultIssue=false;S.defaultAddressValid=true;S.defaultsDone=true;render();toast('地址异常已解决并留痕（演示）')">解决地址异常</button><button class="btn" onclick="modal('受控代改','原值：示例路 100 号；新值：示例路 102 号；理由：职工电话确认（合成）；操作者：采购 A；保存后写入时间与日志。')">演示受控代改</button></div></div><div class="hint">Q14 为产品设计事项：提醒、例外处理与恢复方式可在验证中优化，不是新增甲方依赖。</div>${S.role==='采购人员'?next('handoff'):''}`}
function runDefaults(){modal('执行默认处理',`<p>未提交人员将采用活动预设默认套餐与默认地址。</p><p>若无有效默认地址，则进入异常队列，不自动生成错误地址。</p>`,'确认执行',"if(S.defaultAddressValid){S.defaultsDone=true;S.defaultIssue=false}else{S.defaultsDone=false;S.defaultIssue=true}closeModal();render();toast(S.defaultIssue?'已进入地址异常队列':'默认处理完成（演示）')")}
function handoff(){const tabs=[['stats','统计核对'],['formal','正式交接'],['versions','版本与回执']];let b='';if(S.handoffTab==='stats')b=`<div class="grid g3"><div class="panel"><div class="muted">参与结果</div><div class="metric">4</div></div><div class="panel"><div class="muted">套餐数量</div><div class="metric">4</div></div><div class="panel"><div class="muted">余额合计</div><div class="metric">18.40</div></div></div><div class="panel"><h3>BOM 核对</h3><table><tr><th>商品标识</th><th>商品</th><th>数量</th><th>金额</th></tr><tr><td>SKU-DEMO-001</td><td>防护用品 P1</td><td>3</td><td>384.00</td></tr><tr><td>SKU-DEMO-002</td><td>防护用品 P2</td><td>3</td><td>446.40</td></tr></table>${!S.defaultsDone||S.defaultIssue?`<div class="error">截止默认或地址异常尚未完成，不能冻结统计版本。</div>`:''}<div class="actions"><button class="btn" onclick="toast('统计与逐人结果一致（演示）')">执行一致性核对</button><button class="btn primary" ${S.defaultsDone&&!S.defaultIssue?'':'disabled'} onclick="S.statsFrozen=true;S.handoffTab='formal';render()">冻结统计版本</button></div></div>`;if(S.handoffTab==='formal')b=`<div class="panel"><h3>正式交接预览</h3><div class="checkrow"><span>统计版本</span><span class="grow"></span><b>${S.statsFrozen?'STAT-DEMO-01（已冻结）':'尚未冻结'}</b></div><div class="checkrow"><span>唯一生效交接版</span><span class="grow"></span><b>${S.received?'HANDOFF-DEMO-V1':'尚未生效'}</b></div>${q('Q11','正式商品字段和计价口径待确认；示例 BOM 不作为正式模板。')}${q('Q15','正式交接模板、回执、生效、撤回／重发和异常回传责任待确认。')}<button class="btn primary" ${S.statsFrozen?'':'disabled'} onclick="S.candidateGenerated=true;S.handoffTab='versions';render();toast('已生成交接候选版本（演示）')">生成交接候选版本</button></div>`;if(S.handoffTab==='versions')b=`<div class="panel"><h3>版本与回执</h3>${!S.candidateGenerated?`<div class="error">尚未冻结统计并生成候选版本，不能发送。</div>`:''}<table><tr><th>版本</th><th>发送状态</th><th>回执</th><th>生效状态</th></tr><tr><td>${S.candidateGenerated?'HANDOFF-DEMO-V1':'—'}</td><td>${!S.candidateGenerated?'未生成':S.sendFailed?'发送失败':S.received?'已发送':'待发送'}</td><td>${S.received?'已接收（演示）':'—'}</td><td><span class="status ${S.received?'ok':'wait'}">${S.received?'当前唯一生效':'未生效'}</span></td></tr></table>${S.sendFailed?`<div class="error">网络中断：发送失败。未产生新生效版本，可安全重试。</div>`:''}<div class="actions"><button class="btn" ${S.candidateGenerated?'':'disabled'} onclick="S.sendFailed=true;S.received=false;render()">演示发送失败</button><button class="btn primary" ${S.candidateGenerated?'':'disabled'} onclick="S.sendFailed=false;S.received=true;render();toast('已记录接收回执并设为唯一生效版（演示）')">${S.sendFailed?'重试并接收':'发送并模拟回执'}</button></div><div class="hint">新版本只有在收到有效回执后才可替代旧版本；具体标准受 Q15 控制。</div></div>`;return head('统计、BOM 与正式交接','分步完成统计核对、正式交接及版本回执')+`<div class="tabs">${tabs.map(t=>`<button class="tab ${S.handoffTab===t[0]?'on':''}" onclick="S.handoffTab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${b}<div class="footer-nav"><span class="muted">收到有效回执后交给职工签收</span><button class="btn primary" ${S.received?'':'disabled'} onclick="switchRole('职工','receipt')">进入职工签收演示</button></div>`}
function receipt(){return head('职工收货与签收','职工仅记录本人逐单收货结果；采购端读取该结果','职工（移动端）')+`<div class="mobile-wrap"><div class="mobile"><div class="mobile-head"><b>收货与签收</b><br><small>包裹 DEMO-PKG-001</small></div><div class="mobile-body">${S.signed?`<div class="success"><h2>${S.receiptType==='proxy'?'他人代收':'本人收货'}已记录</h2><p>签收记录：SIGN-DEMO-001</p>${S.receiptType==='proxy'?`<p>代收说明：${S.proxyNote}</p>`:''}<p>时间：本地演示时间</p></div><button class="btn" onclick="S.signed=false;render()">重新演示</button>`:`<h2>核对收货信息</h2><p><b>套餐 ${S.pkg||'A'}</b> · 2 件商品</p><label class="choice"><input type="radio" name="recv" value="self"> 本人已收货</label><label class="choice"><input type="radio" name="recv" value="proxy"> 他人代收</label><div class="field"><label>代收或异常说明</label><textarea id="recvNote" placeholder="代收人关系，或少件、破损、拒收说明"></textarea></div><button class="btn primary" onclick="signIt()">确认并记录个人签收</button>`}<div class="hint">本原型用确认动作代替真实手写签名采集；正式凭证形式与清单受 Q17 控制。</div></div></div></div><div class="footer-nav"><span class="muted">签收后切回采购角色</span><button class="btn primary" ${S.signed?'':'disabled'} onclick="switchRole('采购人员','archive')">采购端查看履约结果</button></div>`}
function signIt(){const r=document.querySelector('input[name=recv]:checked');if(!r){toast('请选择本人收货或他人代收');return}const note=document.querySelector('#recvNote').value.trim();if(r.value==='proxy'&&!note){toast('他人代收需填写代收说明');return}S.receiptType=r.value;S.proxyNote=note;modal('确认个人签收',`<p>将记录当前人员、收货方式和本地演示时间。</p><p>采购人员不能在管理端批量代替职工签收。</p>`,'确认',"S.signed=true;closeModal();render();toast('个人签收已记录（演示）')")}
function archive(){const receiptLabel=S.signed?(S.receiptType==='proxy'?'他人代收':'本人收货'):'待签收';const logComplete=S.published&&S.statsFrozen&&S.received&&S.signed;const checks=[['规则与人员快照',S.published?'完整':'活动未发布'],['参与与默认处理',S.defaultsDone&&!S.defaultIssue?'完整':'未完成'],['统计版本',S.statsFrozen?'完整':'未冻结'],['生效交接版本',S.received?'完整':'缺少回执'],['个人签收与补证',S.signed&&S.evidence?'完整':'不完整'],['操作日志',logComplete?'完整':'关键事件未齐']];return head('履约、补证与归档','采购端查看逐人结果、处理履约异常并汇集证据',S.role==='财务／审计'?'财务／审计（只读核验）':'采购人员（PC 管理端）')+`<div class="grid g2"><section class="panel"><h2>逐人履约</h2><table><tr><th>人员</th><th>收货</th><th>凭证</th><th>异常</th></tr><tr><td>职工 A01</td><td><span class="status ${S.signed?'ok':'wait'}">${receiptLabel}</span>${S.receiptType==='proxy'?`<br><small>${S.proxyNote}</small>`:''}</td><td>${S.signed?'SIGN-DEMO-001':'—'}</td><td>无</td></tr><tr><td>职工 A02</td><td><span class="status ok">他人代收</span></td><td>${S.evidence?'EVID-DEMO-002':'缺失'}</td><td>${S.evidence?'已补证':'待补证'}</td></tr></table><div class="actions"><button class="btn" onclick="toast('已发送补证请求（演示）')">发起补证</button><button class="btn primary" onclick="S.evidence=true;render();toast('补证材料已关联（演示）')">模拟收到补证</button></div></section><section class="panel"><h2>归档校验</h2>${checks.map(x=>`<div class="checkrow"><span>${x[0]}</span><span class="grow"></span><span class="status ${x[1]==='完整'?'ok':'bad'}">${x[1]}</span></div>`).join('')}${q('Q17','财务／审计证据清单、文件格式、补证责任和正式归档条件尚未确认。原型不自动形成审计结论。')}<button class="btn primary" onclick="archiveDemo()">完成演示归档校验</button></section></div><div class="panel"><h2>流程终点</h2><p>活动从准备、参与、交接到逐人签收和证据汇集已形成可演示闭环。正式归档仍需 Q17 责任方确认。</p>${S.role==='采购人员'?`<button class="btn" onclick="go('workbench')">返回工作台</button>`:''}</div>`}
function archiveDemo(){const logComplete=S.published&&S.statsFrozen&&S.received&&S.signed;if(!S.published||!S.defaultsDone||S.defaultIssue||!S.statsFrozen||!S.candidateGenerated||!S.received||!S.signed||!S.evidence||!logComplete){toast('前置流程、操作日志或证据仍有缺失，不能完成归档校验');return}modal('演示闭环完成',`<div class="success">所有原型内演示条件已满足。</div><p>此结果仅说明交互流程可走通，不代表真实用户测试、正式验收或审计通过。</p><p>正式归档条件继续受 Q17 控制。</p>`,'返回工作台',"closeModal();S.activity='待归档（Q17 待确认）';go('workbench')")}
const renderers={workbench,activity,people,packages,publish,employee,progress,handoff,receipt,archive};
function globalOverlay(v){if(v==='normal'){closeModal();return}const m={login:['SSO 登录／返回','模拟跳转至既有 SSO；成功后返回原任务位置。'],expired:['会话已失效','已保留未提交内容。重新登录后可回到当前步骤。'],denied:['无权限','当前角色无权执行此操作。可返回工作台或联系授权人员。'],identity:['身份识别失败','未匹配到有效人员身份，不能展示个人活动。'],org:['组织识别失败','账号未关联可用组织，请联系管理员核对组织关系。'],service:['权限服务不可用','暂时无法校验权限。系统不放行敏感操作，请稍后重试。']}[v];modal(m[0],`<p>${m[1]}</p><p class="muted">FR-01 全局访问状态演示，不额外计入 10 个主要页面。</p>`,'恢复正常',"document.querySelector('#globalState').value='normal';closeModal()")}
globalState.addEventListener('change',e=>globalOverlay(e.target.value));
roleSelect.addEventListener('change',e=>{S.role=e.target.value;S.page=roleHome(S.role);render()});
function render(){nav();view.innerHTML=renderers[S.page]();document.querySelector('#roleLine').textContent=S.role+' · 华东分公司（合成示例）';roleSelect.value=S.role;if(!['采购人员','职工'].includes(S.role)){view.insertAdjacentHTML('afterbegin',`<div class="hint"><b>${S.role} 权限演示：</b>仅展示授权范围内页面；正式岗位、审批级数与敏感操作仍受 Q02 控制。${S.role==='财务／审计'?'当前为只读核验态。':'仅开放标记的职责动作。'}</div>`);view.querySelectorAll('button').forEach(b=>b.disabled=true);view.querySelectorAll('[data-role-action]').forEach(b=>b.disabled=false)}}
render();
</script>
</body>
